# =================================================
# Docker Compose for Production Server
# =================================================
services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:17-alpine
    container_name: sri-postgres
    restart: unless-stopped
    environment:
      TZ: America/Guayaquil
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '3'

  # ─── Redis (BullMQ + Cache) ───
  redis:
    image: redis:7-alpine
    container_name: carbone-redis
    restart: unless-stopped
    environment:
      TZ: America/Guayaquil
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 60 1000
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '3'

  # ─── Carbone.io (Generación de PDFs) ───
  carbone:
    image: carbone/carbone-ee:latest
    container_name: open-api-carbone
    restart: unless-stopped
    environment:
      - CARBONE_EE_STUDIO=true
      - TZ=America/Guayaquil
    volumes:
      - ${HOST_TEMPLATES_PATH:-../data/templates}:/app/template
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/localhost/4000"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

  # ─── Open API Facturación SRI ───
  open-api-facturacion-sri:
    image: ${DOCKER_IMAGE:-angelobarzola/open-api-facturacion-sri:latest}
    container_name: open-api-facturacion-sri
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.docker
    environment:
      TZ: America/Guayaquil
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CARBONE_API: http://carbone:4000
    ports:
      - '127.0.0.1:${PORT:-3001}:3001'
    volumes:
      - ${HOST_TEMPLATES_PATH:-../data/templates}:/data/templates
      - ${HOST_PDFS_PATH:-../data/pdfs}:/data/pdfs
      - ${HOST_CERTS_PATH:-../data/certs}:/data/certs
      - ${HOST_XMLS_PATH:-../data/xmls}:/data/xmls
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      carbone:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:3001/status',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
